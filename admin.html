<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RichDNA™ Admin | Rich Dadiii</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root { --bg:#05080F; --ink:#F5F6FA; --muted:rgba(245,246,250,.6); --faint:rgba(245,246,250,.4); --line:rgba(255,255,255,.09); --card:rgba(255,255,255,.04); --blue:#0D43AA; --blue2:#1652CC; --accent:#7FA0EE; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:'Poppins',sans-serif; -webkit-font-smoothing:antialiased; }
  body { min-height:100vh; background:radial-gradient(1100px 700px at 85% -10%, rgba(13,67,170,.28), transparent 60%), linear-gradient(180deg,#05080F,#060A16); }
  [hidden] { display:none !important; }
  h1, h2 { font-family:'Playfair Display',serif; font-weight:600; margin:0; }
  .eyebrow { font-size:11px; font-weight:600; letter-spacing:.28em; color:var(--accent); text-transform:uppercase; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 22px; border-radius:4px; border:none; cursor:pointer; font:600 12px/1 'Poppins',sans-serif; letter-spacing:.14em; text-transform:uppercase; color:#fff; background:var(--blue); transition:background .15s ease, transform .15s ease; }
  .btn:hover { background:var(--blue2); transform:translateY(-1px); }
  .btn:disabled { opacity:.5; cursor:default; transform:none; }
  .btn.ghost { background:transparent; border:1px solid rgba(255,255,255,.22); color:var(--muted); }
  .btn.ghost:hover { border-color:rgba(255,255,255,.45); color:var(--ink); background:transparent; }
  input[type=email], input[type=search] { width:100%; padding:13px 16px; border-radius:6px; border:1px solid rgba(255,255,255,.13); background:rgba(255,255,255,.05); color:var(--ink); font:400 15px 'Poppins',sans-serif; outline:none; }
  input:focus { border-color:var(--accent); }
  input::placeholder { color:rgba(245,246,250,.35); }

  /* Sign-in */
  .gate { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 16px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:32px; }
  .brand img { width:38px; height:auto; }
  .brand span { font-family:'Playfair Display',serif; font-size:16px; letter-spacing:.14em; }
  .card { width:100%; max-width:440px; padding:38px 34px; border-radius:14px; background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.025)); border:1px solid var(--line); box-shadow:0 24px 70px rgba(0,0,0,.4); }
  .card h1 { font-size:28px; margin:12px 0 8px; }
  .card p { margin:0 0 22px; font-size:14px; font-weight:300; line-height:1.65; color:var(--muted); }
  .card form { display:flex; flex-direction:column; gap:14px; }
  .msg { margin-top:14px; font-size:13px; line-height:1.5; }
  .msg.err { color:#F0A9A9; }
  .msg.ok { color:#9FD9A8; }

  /* Dashboard */
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; max-width:1280px; margin:0 auto; padding:24px 32px; }
  .top .who { font-size:12px; color:var(--faint); }
  main { max-width:1280px; margin:0 auto; padding:0 32px 64px; }
  .head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:8px 0 22px; }
  .head h1 { font-size:clamp(28px, 4vw, 40px); margin-top:10px; }
  .count { font-size:14px; color:var(--muted); margin-top:6px; }
  .tools { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .tools input { width:300px; max-width:100%; }
  .tablecard { border-radius:12px; border:1px solid var(--line); background:var(--card); overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; min-width:980px; }
  th { text-align:left; font-size:10.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); padding:14px 16px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td { padding:13px 16px; border-bottom:1px solid rgba(255,255,255,.05); color:rgba(245,246,250,.85); white-space:nowrap; }
  tbody tr { cursor:pointer; transition:background .12s ease; }
  tbody tr:hover { background:rgba(13,67,170,.18); }
  td.name { font-weight:500; color:#fff; }
  .empty { padding:48px 16px; text-align:center; color:var(--faint); font-size:14px; }

  /* Detail */
  .overlay { position:fixed; inset:0; z-index:20; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 16px; background:rgba(3,4,8,.78); backdrop-filter:blur(6px); }
  .detail { width:100%; max-width:640px; padding:34px 32px; border-radius:14px; background:#0B101C; border:1px solid rgba(255,255,255,.12); box-shadow:0 30px 90px rgba(0,0,0,.6); }
  .detail h2 { font-size:28px; margin:10px 0 4px; }
  .detail .sub { font-size:13px; color:var(--muted); }
  .facts { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; margin:24px 0; }
  .fact { padding:12px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); }
  .fact b { display:block; font-size:10px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); margin-bottom:4px; }
  .fact span { font-size:14px; }
  .bars h3 { font-size:11px; font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); margin:22px 0 12px; }
  .bar { margin-bottom:10px; }
  .bar .l { display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-bottom:5px; }
  .bar .t { height:7px; border-radius:999px; background:rgba(255,255,255,.07); overflow:hidden; }
  .bar .f { height:100%; border-radius:999px; background:rgba(255,255,255,.22); }
  .bar.top .l { color:var(--accent); font-weight:600; }
  .bar.top .f { background:linear-gradient(90deg, var(--blue), var(--accent)); }
  .detail .close { margin-top:26px; }

  @media (max-width:600px) {
    .top, main { padding-left:16px; padding-right:16px; }
    .card, .detail { padding:28px 20px; }
    .facts { grid-template-columns:1fr; }
    .tools, .tools input, .tools .btn { width:100%; }
  }
</style>
</head>
<body>

<!-- Sign-in -->
<section class="gate" id="v-login" hidden>
  <div class="brand"><img src="assets/logo-white-hd.png" alt="Rich Dadiii"><span>RICHDNA™ ADMIN</span></div>
  <div class="card">
    <div class="eyebrow">Private</div>
    <h1>Sign in</h1>
    <p>Enter the admin email and we'll send you a sign-in link.</p>
    <form id="f-login">
      <input type="email" id="i-email" required placeholder="you@example.com" autocomplete="email">
      <button class="btn" id="b-send" type="submit">Send sign-in link</button>
    </form>
    <div class="msg" id="m-login" role="status"></div>
  </div>
</section>

<!-- Signed in, but not the owner -->
<section class="gate" id="v-denied" hidden>
  <div class="card">
    <div class="eyebrow">No access</div>
    <h1>This account can't view RichDNA™ submissions.</h1>
    <p id="m-denied"></p>
    <button class="btn ghost" data-signout type="button">Sign out</button>
  </div>
</section>

<!-- Dashboard -->
<div id="v-app" hidden>
  <header class="top">
    <div class="brand" style="margin:0"><img src="assets/logo-white-hd.png" alt="Rich Dadiii"><span>RICHDNA™ ADMIN</span></div>
    <div class="tools"><span class="who" id="t-who"></span><button class="btn ghost" data-signout type="button">Sign out</button></div>
  </header>
  <main>
    <div class="head">
      <div>
        <div class="eyebrow">Submissions</div>
        <h1>Everyone who took RichDNA™</h1>
        <div class="count" id="t-count">Loading…</div>
      </div>
      <div class="tools">
        <input type="search" id="i-search" placeholder="Search name or email" aria-label="Search name or email">
        <button class="btn" id="b-export" type="button" disabled>⤓ Download Excel</button>
      </div>
    </div>
    <div class="msg err" id="m-app" role="alert"></div>
    <div class="tablecard">
      <table>
        <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Birthdate</th><th>Gender</th><th>Western</th><th>Chinese</th><th>Life Path</th><th>Receives</th><th>Gives</th></tr></thead>
        <tbody id="t-body"></tbody>
      </table>
      <div class="empty" id="t-empty" hidden></div>
    </div>
  </main>
</div>

<!-- One person's result -->
<div class="overlay" id="v-detail" hidden>
  <div class="detail" role="dialog" aria-modal="true" aria-labelledby="d-name">
    <div class="eyebrow">RichDNA™ result</div>
    <h2 id="d-name"></h2>
    <div class="sub" id="d-sub"></div>
    <div class="facts" id="d-facts"></div>
    <div class="bars" id="d-recv"></div>
    <div class="bars" id="d-give"></div>
    <button class="btn ghost close" id="b-close" type="button">Close</button>
  </div>
</div>

<script type="module">
import { SUPABASE_URL, SUPABASE_KEY, ADMIN_EMAIL, loadCreateClient } from './engines/supabase-config.js';
import { filterRows, toExportRows, exportFilename, formatManila, loginMessage } from './engines/admin-data.js';

const $ = (id) => document.getElementById(id);
const views = ['v-login', 'v-denied', 'v-app'];
const show = (id) => views.forEach((v) => { $(v).hidden = v !== id; });
// Build table/detail cells with textContent only — names come from visitors.
const el = (tag, props = {}, kids = []) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };

let db, rows = [], loaded = false;

async function init() {
  try {
    const createClient = await loadCreateClient();
    db = createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch (e) {
    show('v-login');
    $('m-login').className = 'msg err';
    $('m-login').textContent = 'Could not load the sign-in service. Check your connection and refresh.';
    return;
  }
  db.auth.onAuthStateChange((_event, session) => setTimeout(() => route(session), 0));
  const { data } = await db.auth.getSession();
  route(data.session);
}

function route(session) {
  const email = session && session.user && session.user.email;
  if (!email) { loaded = false; rows = []; return show('v-login'); }
  if (email.toLowerCase() !== ADMIN_EMAIL) {
    $('m-denied').textContent = `You're signed in as ${email}.`;
    return show('v-denied');
  }
  $('t-who').textContent = email;
  show('v-app');
  if (!loaded) { loaded = true; loadRows(); }
}

async function loadRows() {
  $('m-app').textContent = '';
  const all = [], page = 1000;
  for (let from = 0; ; from += page) {
    const { data, error } = await db.from('richdna_submissions').select('*')
      .order('created_at', { ascending: false }).range(from, from + page - 1);
    if (error) { $('m-app').textContent = 'Could not load submissions: ' + error.message; loaded = false; break; }
    all.push(...data);
    if (data.length < page) break;
  }
  rows = all;
  render();
}

function render() {
  const list = filterRows(rows, $('i-search').value);
  const q = $('i-search').value.trim();
  $('t-count').textContent = q
    ? `${list.length} of ${rows.length} submission${rows.length === 1 ? '' : 's'} match “${q}”`
    : `${rows.length} submission${rows.length === 1 ? '' : 's'}`;
  $('b-export').disabled = list.length === 0;
  $('t-body').replaceChildren(...list.map((r) => {
    const tr = el('tr', {}, [
      el('td', { textContent: formatManila(r.created_at) }),
      el('td', { className: 'name', textContent: `${r.first_name} ${r.last_name}` }),
      el('td', { textContent: r.email }),
      el('td', { textContent: r.birthdate }),
      el('td', { textContent: r.gender || '—' }),
      el('td', { textContent: r.western_sign }),
      el('td', { textContent: r.chinese_animal }),
      el('td', { textContent: `${r.life_path_number} · ${r.life_path_title}` }),
      el('td', { textContent: r.receiving_top }),
      el('td', { textContent: r.giving_top }),
    ]);
    tr.tabIndex = 0;
    tr.addEventListener('click', () => openDetail(r));
    tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') openDetail(r); });
    return tr;
  }));
  $('t-empty').hidden = list.length > 0;
  $('t-empty').textContent = rows.length ? 'No one matches that search.' : 'No submissions yet. They appear here as people finish RichDNA™.';
}

function bars(title, scores) {
  const sorted = [...(scores || [])].sort((a, b) => b.pct - a.pct);
  return [el('h3', { textContent: title }), ...sorted.map((s, i) => el('div', { className: 'bar' + (i === 0 ? ' top' : '') }, [
    el('div', { className: 'l' }, [el('span', { textContent: s.name }), el('span', { textContent: s.pct + '%' })]),
    el('div', { className: 't' }, [el('div', { className: 'f', style: `width:${Number(s.pct) || 0}%` })]),
  ]))];
}

function openDetail(r) {
  $('d-name').textContent = `${r.first_name} ${r.last_name}`;
  $('d-sub').textContent = `${r.email} · took it ${formatManila(r.created_at)}`;
  const fact = (label, value) => el('div', { className: 'fact' }, [el('b', { textContent: label }), el('span', { textContent: value })]);
  $('d-facts').replaceChildren(
    fact('Birthdate', r.birthdate), fact('Gender', r.gender || 'Prefer not to say'),
    fact('Western zodiac', r.western_sign), fact('Chinese zodiac', r.chinese_animal),
    fact('Life path', `${r.life_path_number} · ${r.life_path_title}`), fact('Love languages', `Receives: ${r.receiving_top} · Gives: ${r.giving_top}`),
  );
  $('d-recv').replaceChildren(...bars('Receiving love', r.receiving_scores));
  $('d-give').replaceChildren(...bars('Giving love', r.giving_scores));
  $('v-detail').hidden = false;
  $('b-close').focus();
}
const closeDetail = () => { $('v-detail').hidden = true; };

$('f-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('i-email').value.trim();
  const msg = $('m-login');
  $('b-send').disabled = true;
  msg.className = 'msg'; msg.textContent = 'Sending…';
  const { error } = await db.auth.signInWithOtp({
    email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname },
  });
  $('b-send').disabled = false;
  const result = loginMessage(email, error);
  msg.className = result.ok ? 'msg ok' : 'msg err';
  msg.textContent = result.text;
});

document.querySelectorAll('[data-signout]').forEach((b) => b.addEventListener('click', () => db.auth.signOut()));
$('i-search').addEventListener('input', render);
$('b-export').addEventListener('click', () => {
  const sheet = XLSX.utils.json_to_sheet(toExportRows(filterRows(rows, $('i-search').value)));
  const book = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(book, sheet, 'Submissions');
  XLSX.writeFile(book, exportFilename(new Date()));
});
$('b-close').addEventListener('click', closeDetail);
$('v-detail').addEventListener('click', (e) => { if (e.target === $('v-detail')) closeDetail(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDetail(); });

init();
</script>
</body>
</html>
